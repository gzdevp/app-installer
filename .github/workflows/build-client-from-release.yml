name: Compilar Client e appcore.dll do ZIP da Release

on:
  push:
    paths:
      - '.github/workflows/build-client-from-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Localizar ZIP v0.11 nas Releases e verificar SHA-256
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repository = $env:GITHUB_REPOSITORY
          $target = 'Client_DLL_v0_11_CoreTests_Fonte.zip'
          $expected = '6906b6e5a3c55db3ba7d15c24cc86985c4dd536e0469bb5f71ed9c3ba431860d'

          # Consulta as Releases do proprio repositorio usando o token temporario do Actions.
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $uri = "https://api.github.com/repos/$repository/releases?per_page=100"
          $releases = @(Invoke-RestMethod -Uri $uri -Headers $headers)
          $found = @()
          foreach ($release in $releases) {
            foreach ($asset in @($release.assets)) {
              if ($asset.name -eq $target) {
                $found += [pscustomobject]@{ Tag = $release.tag_name; File = $asset.name }
              }
            }
          }

          if ($found.Count -eq 0) {
            Write-Host '=== Assets disponiveis nas Releases do repositorio ==='
            $inventory = @()
            foreach ($release in $releases) {
              foreach ($asset in @($release.assets)) {
                $line = "Tag $($release.tag_name): $($asset.name)"
                $inventory += $line
                Write-Host $line
              }
            }
            if ($inventory.Count -eq 0) { Write-Host '(nenhum asset disponivel)' }
            Add-Content $env:GITHUB_STEP_SUMMARY '### Faltou o ZIP fonte na Release'
            Add-Content $env:GITHUB_STEP_SUMMARY "O arquivo **$target** nao esta em nenhuma Release publicada. Envie exatamente esse ZIP em **Releases -> 1 -> Edit -> Assets** e salve a edicao."
            throw "ZIP v0.11 ausente do GitHub: $target. Veja acima a lista de arquivos encontrados."
          }

          # Prioriza a tag 1 se o mesmo arquivo estiver em varias Releases.
          $chosen = @($found | Where-Object { $_.Tag -eq '1' } | Select-Object -First 1)
          if ($chosen.Count -eq 0) { $chosen = @($found | Select-Object -First 1) }
          $tag = $chosen[0].Tag
          Write-Host "Encontrado ZIP: tag=$tag nome=$target"
          & gh release download $tag --repo $repository --pattern $target --output fonte.zip
          if ($LASTEXITCODE -ne 0) { throw "Falha no download autenticado do asset $target (tag $tag)." }
          if (-not (Test-Path 'fonte.zip')) { throw 'Download nao gerou fonte.zip.' }
          $digest = (Get-FileHash 'fonte.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "SHA256: $digest"
          if ($digest -ne $expected) {
            throw "Arquivo encontrado, mas o SHA256 difere do fonte validado. Esperado: $expected; obtido: $digest. Nao compilar arquivo incorreto."
          }
          Expand-Archive -LiteralPath 'fonte.zip' -DestinationPath '.' -Force
          foreach ($p in @('core_source/go.mod','host_source/ClientHost.c','setup_source/go.mod')) {
            if (-not (Test-Path $p)) { throw "Arquivo obrigatorio ausente no ZIP: $p" }
          }
          Write-Host 'ZIP autentico extraido com estrutura correta.'

      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false

      - name: Instalar MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils


      - name: Compilar DLL e Host sem dependencias externas MinGW
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p dist
          cd core_source
          GOOS=windows GOARCH=amd64 CGO_ENABLED=1 CC=gcc go vet ./...
          # -static links MinGW runtime libraries into the output, when possible.
          # The dependency audit below is authoritative; do not bypass it.
          GOOS=windows GOARCH=amd64 CGO_ENABLED=1 CC=gcc \
            go build -trimpath -buildmode=c-shared -ldflags='-extldflags=-static' \
            -o ../dist/appcore.dll .
          cd ..
          gcc -DUNICODE -D_UNICODE -O2 -Wall -Wextra -static -static-libgcc \
            -municode -mwindows -o dist/Client.exe host_source/ClientHost.c
          test -s dist/Client.exe
          test -s dist/appcore.dll
          test -s dist/appcore.h
          for f in CoreABIVersion CoreProbe CoreStart; do grep -q "$f" dist/appcore.h; done
          {
            echo '=== appcore.dll imported libraries ==='
            objdump -p dist/appcore.dll | grep -i 'DLL Name:' || true
            echo '=== Client.exe imported libraries ==='
            objdump -p dist/Client.exe | grep -i 'DLL Name:' || true
          } | tee dist/DLL_IMPORTS.txt
          if grep -iE '(libwinpthread|libgcc_s|libstdc\+\+|msys-2\.0|libgomp)\.?.*\.dll' dist/DLL_IMPORTS.txt; then
            echo 'ERROR: Dependencia externa do MinGW detectada; o pacote exige apenas um EXE e uma DLL.'
            exit 1
          fi
          ./dist/Client.exe --probe-local

      - name: Testar carregamento com PATH minimo e diagnosticar DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Reproduz um Windows sem runtime MSYS2/MinGW no PATH.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem"
          Write-Host '=== Dependencias diretas ==='
          Get-Content 'dist/DLL_IMPORTS.txt'
          Write-Host '=== Teste Client.exe --probe-local ==='
          # Client.exe e' compilado com -mwindows (subsystem GUI). A invocacao
          # direta via "&" pode nao aguardar nem preencher $LASTEXITCODE.
          # Start-Process -Wait -PassThru captura o codigo real do processo.
          $clientExe = (Resolve-Path 'dist/Client.exe').Path
          $clientDir = (Resolve-Path 'dist').Path
          $process = Start-Process -FilePath $clientExe -ArgumentList @('--probe-local') -WorkingDirectory $clientDir -Wait -PassThru
          $exitCode = $process.ExitCode
          if ($null -eq $exitCode) {
            throw 'O processo terminou sem codigo de saida verificavel.'
          }
          Write-Host "Codigo real de saida do Host: $exitCode"
          if ($exitCode -ne 0) {
            Write-Host '=== Diagnostico Windows LoadLibraryExW ==='
            # Texto de uma linha evita here-string/C# multilinha quebrando o parser PowerShell.
            $member = '[System.Runtime.InteropServices.DllImport("kernel32.dll", EntryPoint="LoadLibraryExW", CharSet=System.Runtime.InteropServices.CharSet.Unicode, SetLastError=true)] public static extern System.IntPtr Load(string path, System.IntPtr reserved, uint flags);'
            Add-Type -Namespace ClientDiagnostics -Name NativeLoader -MemberDefinition $member -ErrorAction Stop
            $dllFile = (Resolve-Path 'dist/appcore.dll').Path
            $module = [ClientDiagnostics.NativeLoader]::Load($dllFile, [IntPtr]::Zero, 0x1100)
            if ($module -eq [IntPtr]::Zero) {
              $win32Code = [Runtime.InteropServices.Marshal]::GetLastWin32Error()
              $description = [ComponentModel.Win32Exception]::new($win32Code).Message
              throw "Falha no LoadLibraryExW: erro Windows $win32Code - $description. Host exit code: $exitCode."
            }
            throw "A DLL carregou no LoadLibraryExW, mas o Host saiu com codigo $exitCode. Verifique exports, ABI e CoreProbe."
          }
          Write-Host 'OK: Client.exe carregou appcore.dll com PATH minimo.'

      - name: Compilar instalador com binarios gerados
        shell: pwsh
        run: |
          Copy-Item 'dist/Client.exe' 'setup_source/payload/Client.exe' -Force
          Copy-Item 'dist/appcore.dll' 'setup_source/payload/appcore.dll' -Force
          Push-Location 'setup_source'
          $env:GOOS = 'windows'; $env:GOARCH = 'amd64'; $env:CGO_ENABLED = '0'
          go build -trimpath -o ../dist/Client_Setup_System32.exe .
          if ($LASTEXITCODE -ne 0) { throw 'Compilacao do instalador falhou' }
          Pop-Location
          & "$PWD\dist\Client_Setup_System32.exe" --inspect-payload
          if ($LASTEXITCODE -ne 0) { throw 'Verificacao do instalador falhou' }
          Get-FileHash -Algorithm SHA256 dist/Client.exe,dist/appcore.dll,dist/Client_Setup_System32.exe |
            ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Encoding ascii dist/SHA256SUMS.txt

      - name: Salvar pacote experimental sem alterar Release principal
        uses: actions/upload-artifact@v4
        with:
          name: Client-DLL-v0_11-Experimental
          path: |
            dist/Client.exe
            dist/appcore.dll
            dist/Client_Setup_System32.exe
            dist/SHA256SUMS.txt
            dist/DLL_IMPORTS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Testes de regressao do codigo legado corrigido (logs detalhados)
        shell: msys2 {0}
        run: |
          set +e
          mkdir -p dist
          cd core_source
          GOOS=windows GOARCH=amd64 CGO_ENABLED=1 CC=gcc go test ./... -count=1 -timeout=10m -v 2>&1 | tee ../dist/core_tests.log
          core_result=${PIPESTATUS[0]}
          cd ../setup_source
          GOOS=windows GOARCH=amd64 CGO_ENABLED=1 CC=gcc go test ./... -count=1 -timeout=5m -v 2>&1 | tee ../dist/setup_tests.log
          setup_result=${PIPESTATUS[0]}
          cd ..
          printf 'core_exit=%s\nsetup_exit=%s\n' "$core_result" "$setup_result" > dist/TEST_RESULTS.txt
          grep -nE -- '^--- FAIL:|^FAIL($|[[:space:]])|^panic:|^# [[:graph:]]|Error:' dist/core_tests.log > dist/CORE_FAILURES.txt || true
          grep -nE -- '^--- FAIL:|^FAIL($|[[:space:]])|^panic:|^# [[:graph:]]|Error:' dist/setup_tests.log > dist/SETUP_FAILURES.txt || true
          {
            echo '### Resultado dos testes de regressao'
            echo "- Testes do core: codigo $core_result"
            echo "- Testes do instalador: codigo $setup_result"
            echo '- Compilacao e carregamento nao confirmam funcionamento no FiveM.'
            echo ''
            echo '#### Falhas detectadas (core)'
            echo '```text'
            if [ -s dist/CORE_FAILURES.txt ]; then head -100 dist/CORE_FAILURES.txt; else echo '(nenhuma linha de falha encontrada)'; fi
            echo '```'
            echo '#### Falhas detectadas (instalador)'
            echo '```text'
            if [ -s dist/SETUP_FAILURES.txt ]; then head -80 dist/SETUP_FAILURES.txt; else echo '(nenhuma linha de falha encontrada)'; fi
            echo '```'
            echo 'Os logs integrais sao enviados no artifact Diagnostico-DLL se houver falha.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$core_result" -ne 0 ] || [ "$setup_result" -ne 0 ]; then
            echo 'Os testes falharam. Consulte a secao Build summary e o artifact Diagnostico-DLL.'
            exit 1
          fi
          echo 'Testes passaram; ainda precisa de validacao no FiveM.'

      - name: Salvar diagnostico em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostico-DLL
          path: |
            dist/DLL_IMPORTS.txt
            dist/appcore.h
            dist/core_tests.log
            dist/setup_tests.log
            dist/TEST_RESULTS.txt
            dist/CORE_FAILURES.txt
            dist/SETUP_FAILURES.txt
          if-no-files-found: warn
          retention-days: 7
