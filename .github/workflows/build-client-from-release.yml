name: Compilar Client e appcore.dll do ZIP da Release

on:
  push:
    paths:
      - '.github/workflows/build-client-from-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false

      - name: Instalar MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils

      - name: Baixar e extrair codigo da Release 1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = 'https://github.com/gzdevp/app-installer/releases/download/1/Client_DLL_v0_9_System32_Fonte_Build_Setup.zip'
          Invoke-WebRequest -Uri $asset -OutFile 'fonte.zip'
          Expand-Archive -LiteralPath 'fonte.zip' -DestinationPath '.' -Force
          foreach ($p in @('core_source/go.mod','host_source/ClientHost.c','setup_source/go.mod')) {
            if (-not (Test-Path $p)) { throw "Arquivo obrigatorio ausente: $p" }
          }

      - name: Compilar DLL e Host sem dependencias externas MinGW
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p dist
          cd core_source
          GOOS=windows GOARCH=amd64 CGO_ENABLED=1 CC=gcc go vet ./...
          # -static links MinGW runtime libraries into the output, when possible.
          # The dependency audit below is authoritative; do not bypass it.
          GOOS=windows GOARCH=amd64 CGO_ENABLED=1 CC=gcc \
            go build -trimpath -buildmode=c-shared -ldflags='-extldflags=-static' \
            -o ../dist/appcore.dll .
          cd ..
          gcc -DUNICODE -D_UNICODE -O2 -Wall -Wextra -static -static-libgcc \
            -municode -mwindows -o dist/Client.exe host_source/ClientHost.c
          test -s dist/Client.exe
          test -s dist/appcore.dll
          test -s dist/appcore.h
          for f in CoreABIVersion CoreProbe CoreStart; do grep -q "$f" dist/appcore.h; done
          {
            echo '=== appcore.dll imported libraries ==='
            objdump -p dist/appcore.dll | grep -i 'DLL Name:' || true
            echo '=== Client.exe imported libraries ==='
            objdump -p dist/Client.exe | grep -i 'DLL Name:' || true
          } | tee dist/DLL_IMPORTS.txt
          if grep -iE '(libwinpthread|libgcc_s|libstdc\+\+|msys-2\.0|libgomp)\.?.*\.dll' dist/DLL_IMPORTS.txt; then
            echo 'ERROR: Dependencia externa do MinGW detectada; o pacote exige apenas um EXE e uma DLL.'
            exit 1
          fi
          ./dist/Client.exe --probe-local

      - name: Testar carregamento com PATH minimo e diagnosticar DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Reproduz um Windows sem runtime MSYS2/MinGW no PATH.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem"
          Write-Host '=== Dependencias diretas ==='
          Get-Content 'dist/DLL_IMPORTS.txt'
          Write-Host '=== Teste Client.exe --probe-local ==='
          & "$PWD\dist\Client.exe" --probe-local
          $exitCode = $LASTEXITCODE
          Write-Host "Codigo de saida do Host: $exitCode"
          if ($exitCode -ne 0) {
            Write-Host '=== Diagnostico Windows LoadLibraryExW ==='
            # Texto de uma linha evita here-string/C# multilinha quebrando o parser PowerShell.
            $member = '[System.Runtime.InteropServices.DllImport("kernel32.dll", EntryPoint="LoadLibraryExW", CharSet=System.Runtime.InteropServices.CharSet.Unicode, SetLastError=true)] public static extern System.IntPtr Load(string path, System.IntPtr reserved, uint flags);'
            Add-Type -Namespace ClientDiagnostics -Name NativeLoader -MemberDefinition $member -ErrorAction Stop
            $dllFile = (Resolve-Path 'dist/appcore.dll').Path
            $module = [ClientDiagnostics.NativeLoader]::Load($dllFile, [IntPtr]::Zero, 0x1100)
            if ($module -eq [IntPtr]::Zero) {
              $win32Code = [Runtime.InteropServices.Marshal]::GetLastWin32Error()
              $description = [ComponentModel.Win32Exception]::new($win32Code).Message
              throw "Falha no LoadLibraryExW: erro Windows $win32Code - $description. Host exit code: $exitCode."
            }
            throw "A DLL carregou no LoadLibraryExW, mas o Host saiu com codigo $exitCode. Verifique exports, ABI e CoreProbe."
          }
          Write-Host 'OK: Client.exe carregou appcore.dll com PATH minimo.'

      - name: Compilar instalador com binarios gerados
        shell: pwsh
        run: |
          Copy-Item 'dist/Client.exe' 'setup_source/payload/Client.exe' -Force
          Copy-Item 'dist/appcore.dll' 'setup_source/payload/appcore.dll' -Force
          Push-Location 'setup_source'
          $env:GOOS = 'windows'; $env:GOARCH = 'amd64'; $env:CGO_ENABLED = '0'
          go build -trimpath -o ../dist/Client_Setup_System32.exe .
          if ($LASTEXITCODE -ne 0) { throw 'Compilacao do instalador falhou' }
          Pop-Location
          & "$PWD\dist\Client_Setup_System32.exe" --inspect-payload
          if ($LASTEXITCODE -ne 0) { throw 'Verificacao do instalador falhou' }
          Get-FileHash -Algorithm SHA256 dist/Client.exe,dist/appcore.dll,dist/Client_Setup_System32.exe |
            ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Encoding ascii dist/SHA256SUMS.txt

      - name: Salvar pacote experimental sem alterar Release principal
        uses: actions/upload-artifact@v4
        with:
          name: Client-DLL-v0_9-Experimental
          path: |
            dist/Client.exe
            dist/appcore.dll
            dist/Client_Setup_System32.exe
            dist/SHA256SUMS.txt
            dist/DLL_IMPORTS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Testes de regressao do codigo legado
        shell: msys2 {0}
        run: |
          set +e
          cd core_source
          GOOS=windows GOARCH=amd64 CGO_ENABLED=1 CC=gcc go test ./... -count=1 -timeout=10m
          core_result=$?
          cd ../setup_source
          GOOS=windows GOARCH=amd64 CGO_ENABLED=1 CC=gcc go test ./... -count=1 -timeout=5m
          setup_result=$?
          cd ..
          echo '### Resultado dos testes de regressao' >> "$GITHUB_STEP_SUMMARY"
          echo "- Testes do core: codigo $core_result" >> "$GITHUB_STEP_SUMMARY"
          echo "- Testes do instalador: codigo $setup_result" >> "$GITHUB_STEP_SUMMARY"
          echo '- Compilacao e carregamento nao confirmam funcionamento no FiveM.' >> "$GITHUB_STEP_SUMMARY"
          if [ "$core_result" -ne 0 ] || [ "$setup_result" -ne 0 ]; then
            echo 'Testes legados falharam; pacote apenas experimental.'
            exit 1
          fi
          echo 'Testes passaram; ainda precisa de validacao no FiveM.'

      - name: Salvar diagnostico em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostico-DLL
          path: |
            dist/DLL_IMPORTS.txt
            dist/appcore.h
          if-no-files-found: ignore
          retention-days: 7
