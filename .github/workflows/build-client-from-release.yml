name: Compilar Client e appcore.dll do ZIP da Release

on:
  push:
    paths:
      - '.github/workflows/build-client-from-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false

      - name: Instalar MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils

      - name: Baixar e extrair codigo da Release 1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = 'https://github.com/gzdevp/app-installer/releases/download/1/Client_DLL_v0_9_System32_Fonte_Build_Setup.zip'
          Invoke-WebRequest -Uri $asset -OutFile 'fonte.zip'
          Expand-Archive -LiteralPath 'fonte.zip' -DestinationPath '.' -Force
          foreach ($p in @('core_source/go.mod','host_source/ClientHost.c','setup_source/go.mod')) {
            if (-not (Test-Path $p)) { throw "Arquivo obrigatorio ausente: $p" }
          }

      - name: Compilar DLL e Host sem dependencias externas MinGW
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p dist
          cd core_source
          GOOS=windows GOARCH=amd64 CGO_ENABLED=1 CC=gcc go vet ./...
          # -static links MinGW runtime libraries into the output, when possible.
          # The dependency audit below is authoritative; do not bypass it.
          GOOS=windows GOARCH=amd64 CGO_ENABLED=1 CC=gcc \
            go build -trimpath -buildmode=c-shared -ldflags='-extldflags=-static' \
            -o ../dist/appcore.dll .
          cd ..
          gcc -DUNICODE -D_UNICODE -O2 -Wall -Wextra -static -static-libgcc \
            -municode -mwindows -o dist/Client.exe host_source/ClientHost.c
          test -s dist/Client.exe
          test -s dist/appcore.dll
          test -s dist/appcore.h
          for f in CoreABIVersion CoreProbe CoreStart; do grep -q "$f" dist/appcore.h; done
          {
            echo '=== appcore.dll imported libraries ==='
            objdump -p dist/appcore.dll | grep -i 'DLL Name:' || true
            echo '=== Client.exe imported libraries ==='
            objdump -p dist/Client.exe | grep -i 'DLL Name:' || true
          } | tee dist/DLL_IMPORTS.txt
          if grep -iE '(libwinpthread|libgcc_s|libstdc\+\+|msys-2\.0|libgomp)\.?.*\.dll' dist/DLL_IMPORTS.txt; then
            echo 'ERROR: Dependencia externa do MinGW detectada; o pacote exige apenas um EXE e uma DLL.'
            exit 1
          fi
          ./dist/Client.exe --probe-local

      - name: Testar Host com PATH minimo e diagnosticar DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem"
          Write-Host 'Dependencias diretas detectadas:'
          Get-Content 'dist/DLL_IMPORTS.txt'
          & "$PWD\dist\Client.exe" --probe-local
          $hostExit = $LASTEXITCODE
          if ($hostExit -ne 0) {
            Write-Host "Host retornou $hostExit. Executando diagnostico do carregador Windows..."
            Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class ClientLoadProbe {
            [DllImport("kernel32.dll", EntryPoint="LoadLibraryExW", CharSet=CharSet.Unicode, SetLastError=true)]
            public static extern IntPtr Load(string path, IntPtr reserved, uint flags);
          }
          '@
            $dllPath = (Resolve-Path 'dist/appcore.dll').Path
            $mod = [ClientLoadProbe]::Load($dllPath, [IntPtr]::Zero, 0x1100)
            if ($mod -eq [IntPtr]::Zero) {
              $err = [Runtime.InteropServices.Marshal]::GetLastWin32Error()
              $msg = (New-Object ComponentModel.Win32Exception($err)).Message
